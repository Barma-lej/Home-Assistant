# Shelly Kueche
# https://www.home-assistant.io/integrations/shelly/

# Automation ########################################################
automation:
  - id: telegram_kueche
    alias: "Telegram - Kueche"
    mode: parallel
    triggers:
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/kuechenlicht"
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/kuechenlicht"

      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/essecke"
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/essecke"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.command == '/kuechenlicht' }}"
            sequence:
              - action: light.toggle
                data:
                  entity_id: light.kuche

              - wait_for_trigger:
                  - trigger: state
                    entity_id: light.kuche
                continue_on_timeout: true
                timeout: "00:00:01"

              - action: script.telegram_callback
                data:
                  target: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id if trigger.event.event_type == 'telegram_callback' else 1000 }}"
                  message: "💡 {{ state_attr('light.kuche', 'friendly_name') }} - {{ states('light.kuche') }}"

          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.command == '/essecke' }}"
            sequence:
              - action: light.toggle
                data:
                  entity_id: light.erker

              - wait_for_trigger:
                  - trigger: state
                    entity_id: light.erker
                continue_on_timeout: true
                timeout: "00:00:01"

              - action: script.telegram_callback
                data:
                  target: "{{ trigger.event.data.chat_id }}"
                  message_id: "{{ trigger.event.data.message.message_id if trigger.event.event_type == 'telegram_callback' else 1000 }}"
                  message: "💡 {{ state_attr('light.erker', 'friendly_name') }} - {{ states('light.erker') }}"
