# Shelly Rollladen 1
# https://www.home-assistant.io/integrations/shelly/

# Automation ########################################################
automation:
  - id: telegram_rollladen_control
    alias: "Telegram - Rollladen Control"
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type:
          - telegram_command
          - telegram_callback
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.command in [
            '/rollladen_1',
            '/rollladen_2',
            '/rollladen_3',
            '/rollladen_4'
          ] }}
    variables:
      target_cover: "cover.{{ trigger.event.data.command | replace('/', '') }}"
      current_state: "{{ states(target_cover) }}"
    actions:
      - action: cover.toggle
        target:
          entity_id: "{{ target_cover }}"

      - wait_template: "{{ states(target_cover) != current_state }}"
        timeout: "00:00:02"
        continue_on_timeout: true

      - action: script.telegram_callback
        data:
          target: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id if trigger.event.event_type == 'telegram_callback' else 1000 }}"
          message: "🏡 {{ state_attr(target_cover, 'friendly_name') }} - {{ states(target_cover) }}"
