# Shelly Wohnlicht
# https://www.home-assistant.io/integrations/shelly/

# Automation ########################################################
automation:
  - id: telegram_wohnlicht
    alias: "Telegram - Wohnlicht"
    mode: parallel
    triggers:
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/wohnlicht"

      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/wohnlicht"

    actions:
      - action: light.toggle
        data:
          entity_id: light.wohnlicht_2

      - wait_for_trigger:
          - trigger: state
            entity_id: light.wohnlicht_2
        timeout: 1
        continue_on_timeout: true

      - action: script.telegram_callback
        data:
          target: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id if trigger.event.event_type == 'telegram_callback' else 1000 }}"
          message: "💡 {{ state_attr('light.wohnlicht_2', 'friendly_name') }} ist {{ states('light.wohnlicht_2') }}"
