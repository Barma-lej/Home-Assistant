# Shelly Rollladen 2
# https://www.home-assistant.io/integrations/shelly/

# Automation ########################################################
automation:
  - id: telegram_rollladen_2
    alias: "Telegram - Rollladen 2"
    mode: restart
    triggers:
      - trigger: event
        event_type: telegram_command
        event_data:
          command: "/rollladen_2"

      - trigger: event
        event_type: telegram_callback
        event_data:
          command: "/rollladen_2"

    actions:
      - action: script.cover_one_button
        data:
          entity_id: rollladen_2

      - wait_for_trigger:
          - trigger: state
            entity_id: cover.rollladen_2
        timeout: "00:00:02"
        continue_on_timeout: true

      - action: script.telegram_callback
        data:
          target: "{{ trigger.event.data.chat_id }}"
          message_id: "{{ trigger.event.data.message.message_id if trigger.event.event_type == 'telegram_callback' else 1000 }}"
          message: "🏡 {{ state_attr('cover.rollladen_2', 'friendly_name') }} - {{ states('cover.rollladen_2') }}"
