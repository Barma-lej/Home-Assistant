scene:
  - id: "relax"
    name: Relax
    icon: mdi:seat-recline-extra
    entities:
      light.ambiente_wz_t3: "on"
      light.sonoffpow_04: "on"
      light.sonoffpow_01: "off"
      light.wohnlicht_2: "off"
      light.kuche: "off"
      light.erker: "off"

script:
  scene_relax:
    alias: Scene - Relax
    mode: single
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.relax
        data:
          transition: 2.5
      - action: media_player.play_media
        target:
          entity_id: media_player.chromecast_ultra
        data:
          media_content_id: ' { "app_name": "youtube", "media_id": "_zWlJpP-ptA" }'
          media_content_type: cast

  scene_tv:
    alias: Scene - TV
    mode: single
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.relax
        data:
          transition: 2.5
      - action: media_player.turn_on
        target:
          entity_id: media_player.gq75qn92catxzg
      - wait_for_trigger:
          - trigger: state
            entity_id: media_player.gq75qn92catxzg
            to: "on"
            for: 10
        timeout: "00:00:20"
        continue_on_timeout: true
      - action: media_player.select_source
        target:
          entity_id: media_player.gq75qn92catxzg
        data:
          source: "HDMI 2/MHL"

google_assistant:
  entity_config:
    scene.relax:
      name: Ablauf Relax
      room: Wohnzimmer
      expose: true

    script.scene_relax:
      name: Relax
      room: Wohnzimmer
      expose: true

    script.scene_tv:
      name: TV_HDMI2
      room: Wohnzimmer
      expose: true
