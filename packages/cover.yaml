# Automations and scripts for covers

template:
  - cover:
      - name: Markise (inverted)
        unique_id: markise_inverted
        device_class: awning
        default_entity_id: cover.markise_inverted
        open_cover:
          - action: cover.open_cover
            target:
              entity_id:
                - cover.markise
        close_cover:
          - action: cover.close_cover
            target:
              entity_id:
                - cover.markise
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id:
                - cover.markise
        set_cover_position:
          - action: cover.set_cover_position
            target:
              entity_id:
                - cover.markise
            data:
              position: "{{ 100 - position }}"
        state: >
          {% if is_state('cover.markise', 'closed') %}
            open
          {% elif is_state('cover.markise', 'open') %}
            closed
          {% else %}
            open
          {% endif %}
        position: "{{ 100 - state_attr('cover.markise', 'current_position') | int(0) }}"

# Cover #############################################################
cover:
  - platform: group
    unique_id: rollladen
    name: Rollladen
    entities:
      - cover.rollladen_1
      - cover.rollladen_2
      - cover.rollladen_3
      - cover.rollladen_4

# Scripts ###########################################################
script:
  #######################################
  # Script to control covers with two buttons.
  # If cover is moving, stop it. Otherwise execute the requested action.
  # Parameters:
  #   entity_id: full cover entity ID (with 'cover.' prefix)
  #   mode: 'open' or 'close'
  #######################################
  cover_start_stop:
    alias: Cover - Two buttons control
    mode: parallel
    fields:
      entity_id:
        description: Full cover entity ID with 'cover.' prefix
        example: "cover.rollladen"
      mode:
        description: Action to perform
        example: "open"
        selector:
          select:
            options:
              - "open"
              - "close"
    sequence:
      - action: >
          {% if states(entity_id) in ['opening', 'closing'] %}
            cover.stop_cover
          {% elif mode == 'open' %}
            cover.open_cover
          {% elif mode == 'close' %}
            cover.close_cover
          {% else %}
            cover.stop_cover
          {% endif %}
        target:
          entity_id: "{{ entity_id }}"

# Customize #########################################################
homeassistant:
  customize:
    cover.rollladen:
      friendly_name: Rollladen
