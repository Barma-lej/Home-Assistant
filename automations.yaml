- id: markisen_automatisch_steuern
  alias: Markisen - Automatisch steuern
  description: Kombinierte Verwaltung für Markise, Seitenmarkise und Markise Links
    basierend auf Sonne, Hitze, Wolken und Regen.
  triggers:
  - trigger: time_pattern
    minutes: /5
  - trigger: state
    entity_id: binary_sensor.mower_rain_sensor
    to: 'on'
    id: rain
  actions:
  - repeat:
      for_each: '{{ COVERS_TO_MANAGE }}'
      sequence:
      - variables:
          cover_entity_id: '{{ repeat.item.entity }}'
          sun_azimuth: '{{ state_attr(''sun.sun'', ''azimuth'') | float(0) }}'
          sun_elevation: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) }}'
          cloud_coverage: '{{ state_attr(WEATHER_SENSOR, ''cloud_coverage'') | float(101)
            }}'
          current_pos: '{{ state_attr(cover_entity_id, ''current_position'') | int(-1)
            }}'
          cover_last_changed_timestamp: '{{ as_timestamp(states[cover_entity_id].last_changed,
            0) }}'
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ sun_azimuth > repeat.item.azimuth_min_deploy and\n
              \  sun_elevation >= repeat.item.elevation_min_deploy and\n   is_state('binary_sensor.klima_heiss',
              'on') and\n   cloud_coverage < CLOUD_COVERAGE_THRESHOLD and\n   is_state(RAIN_SENSOR,
              'off') and\n   current_pos != repeat.item.pos_sun_protection and\n   ((as_timestamp(now())
              - cover_last_changed_timestamp) / 60) > repeat.item.cooldown_minutes\n}}\n"
          alias: Если солнце мешает, жарко, нет облаков и дождя
          sequence:
          - action: cover.set_cover_position
            data:
              position: '{{ repeat.item.pos_sun_protection }}'
            target:
              entity_id: '{{ cover_entity_id }}'
        - conditions:
          - condition: template
            value_template: "{{ sun_elevation < repeat.item.elevation_threshold_retract
              and\n   current_pos != repeat.item.pos_retracted and\n   ((as_timestamp(now())
              - cover_last_changed_timestamp) / 60) > repeat.item.cooldown_minutes\n}}\n"
          alias: Если солнце уже не мешает
          sequence:
          - action: cover.set_cover_position
            data:
              position: '{{ repeat.item.pos_retracted }}'
            target:
              entity_id: '{{ cover_entity_id }}'
        - conditions:
          - condition: trigger
            id:
            - rain
          alias: Если дождь
          sequence:
          - action: cover.set_cover_position
            data:
              position: '{{ repeat.item.pos_retracted }}'
            target:
              entity_id: '{{ cover_entity_id }}'
  mode: single
  variables:
    RAIN_SENSOR: binary_sensor.mower_rain_sensor
    WEATHER_SENSOR: weather.openweathermap
    CLOUD_COVERAGE_THRESHOLD: 150
    COVERS_TO_MANAGE:
    - entity: cover.markise
      azimuth_min_deploy: 180
      elevation_min_deploy: 15
      elevation_threshold_retract: 9
      pos_sun_protection: 100
      pos_retracted: 0
      cooldown_minutes: 60
      note: 'elevation_threshold_retract: 9-11'
    - entity: cover.seitenmarkise
      azimuth_min_deploy: 180
      elevation_min_deploy: 12
      elevation_threshold_retract: 6
      pos_sun_protection: 2
      pos_retracted: 100
      cooldown_minutes: 60
      note: 'elevation_threshold_retract: 6-9'
    - entity: cover.markise_links
      azimuth_min_deploy: 240
      elevation_min_deploy: 12
      elevation_threshold_retract: 6
      pos_sun_protection: 10
      pos_retracted: 100
      cooldown_minutes: 60
      note: 'elevation_threshold_retract: 6-9'
    - entity: cover.markise_rechts
      azimuth_min_deploy: 240
      elevation_min_deploy: 90
      elevation_threshold_retract: 6
      pos_sun_protection: 10
      pos_retracted: 100
      cooldown_minutes: 60
      note: 'elevation_threshold_retract: 6-9'
